<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SMNL League Ticker — Scores & Headlines</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Baloo+2:wght@600;700&display=swap');

:root{
  --field: #173D2E;
  --field-dark: #102A20;
  --chalk: #F4EFE1;
  --navy: #12233B;
  --gold: #F2B33D;
  --red: #C9432F;
}

html, body{
  margin:0; padding:0;
  background: transparent;
  overflow: hidden;
  width: 100vw; height: 100vh;
}

.ticker-bar{
  position: relative;
  width: 100%;
  height: 92px;
  background: linear-gradient(180deg, var(--field) 0%, var(--field-dark) 100%);
  border-top: 4px solid var(--gold);
  border-bottom: 4px solid var(--gold);
  display: flex;
  align-items: center;
  box-shadow: 0 4px 18px rgba(0,0,0,.35);
}

.league-tag{
  flex: 0 0 auto;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 0 28px;
  background: var(--navy);
  border-right: 4px solid var(--gold);
  z-index: 2;
}
.league-tag .name{
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 22px;
  color: var(--chalk);
  letter-spacing: .5px;
  white-space: nowrap;
}
.league-tag .sub{
  font-family: 'Teko', sans-serif;
  font-weight: 500;
  font-size: 15px;
  color: var(--gold);
  letter-spacing: 2px;
  white-space: nowrap;
  margin-top: -2px;
}

.track-wrap{
  flex: 1 1 auto;
  height: 100%;
  overflow: hidden;
  position: relative;
}

.track{
  display: flex;
  align-items: center;
  height: 100%;
  width: max-content;
  animation: scroll-left var(--duration, 45s) linear infinite;
}

@keyframes scroll-left{
  from{ transform: translateX(0); }
  to{ transform: translateX(-50%); }
}

.item{
  display: flex;
  align-items: center;
  height: 100%;
  padding: 0 34px;
  white-space: nowrap;
  flex: 0 0 auto;
}

.item .team{
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 21px;
  color: var(--chalk);
}
.item .team.win{ color: var(--gold); }

.item .score{
  font-family: 'Teko', sans-serif;
  font-weight: 600;
  font-size: 34px;
  color: var(--chalk);
  margin: 0 6px;
  line-height: 1;
}

.item .at{
  font-family: 'Teko', sans-serif;
  font-size: 20px;
  color: rgba(244,239,225,.55);
  margin: 0 10px;
}

.item .headline{
  font-family: 'Baloo 2', sans-serif;
  font-weight: 600;
  font-size: 19px;
  color: var(--chalk);
}
.item .headline .flag{
  color: var(--gold);
  font-weight: 700;
  margin-right: 10px;
}

.item .final-tag{
  font-family: 'Teko', sans-serif;
  font-weight: 600;
  font-size: 16px;
  color: var(--field-dark);
  background: var(--gold);
  padding: 3px 9px 1px;
  border-radius: 4px;
  margin-left: 12px;
  letter-spacing: .5px;
}

.score-box{
  flex: 0 0 auto;
  width: 340px;
  height: 100%;
  position: relative;
  overflow: hidden;
  background: var(--navy);
  border-right: 4px solid var(--gold);
  z-index: 2;
}

.score-slide{
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 22px;
  box-sizing: border-box;
}

.score-fit{
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
  transform-origin: center center;
}

@keyframes score-enter{
  from{ transform: translateY(100%); opacity: 0; }
  to{ transform: translateY(0); opacity: 1; }
}

.score-slide.enter{
  animation: score-enter .55s cubic-bezier(.2,.8,.3,1);
}

.divider{
  flex: 0 0 auto;
  width: 2px;
  height: 34px;
  margin: 0 26px;
  background: rgba(244,239,225,.25);
}

</style>
</head>
<body>

<div class="ticker-bar">
  <div class="league-tag">
    <div class="name" id="leagueName">SMNL</div>
    <div class="sub">SMB4 &middot; SMNL</div>
  </div>
  <div class="score-box" id="scoreBox">
    <div class="score-slide" id="scoreSlide"></div>
  </div>
  <div class="track-wrap">
    <div class="track" id="track"></div>
  </div>
</div>

<script>

// ============================================================
// PASTE YOUR PUBLISHED GOOGLE SHEET CSV URL BELOW (headlines only)
// (File -> Share -> Publish to web -> CSV, in Google Sheets)
// ============================================================
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSP59wDgCakUu1rGQMs2OaOXyGOqM-z0Hgp1MDbSMxoKswawRwByrmK2E4GwX_Y9hNQl5Tmw3IDmiWo/pub?output=csv";

// ============================================================
// SMNL Supabase config (scores) — from the API request found in
// DevTools. Update these only if SMNL changes their database.
// ============================================================
const SUPABASE_URL = "https://hhjmginyyvcrngvcnhdb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_JSBxFG27P4j44Ou1ivP3gw_oSBm-AVs";
const LEAGUES = [
  { seasonId: 5, label: "PRO" },
  { seasonId: 6, label: "ALL-STAR" },
  { seasonId: 7, label: "LEGENDARY" },
];

// How many finished games to pull per league, most recent first.
const GAMES_PER_LEAGUE = 24;

// How often to re-check both sources for updates, in seconds.
const REFRESH_SECONDS = 60;

// How fast the headline ticker scrolls. Higher number = slower.
const SCROLL_SECONDS = 45;

// How many seconds each score is shown before flipping to the next.
const SCORE_INTERVAL_SECONDS = 10;

// Shown while nothing has loaded yet / if the sheet is unreachable.
const FALLBACK_HEADLINES = [
  { type: "headline", flag: "SETUP", text: "Paste your Google Sheet CSV link into SHEET_CSV_URL in this file" },
];

// ------------------------------------------------------------
// CSV parsing — handles quoted fields containing commas.
// ------------------------------------------------------------
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else{ field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && next === '\n') i++;
        row.push(field); field = "";
        rows.push(row); row = [];
      } else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ""));
}

function rowsToHeadlines(rows){
  if(!rows.length) return [];
  const header = rows[0].map(h => h.trim().toLowerCase());
  const idx = name => header.indexOf(name);
  const iType = idx("type"), iA = idx("a"), iB = idx("b");

  return rows.slice(1).map(r => {
    const type = (r[iType] || "").trim().toLowerCase();
    if(type !== "headline") return null;
    return { type: "headline", flag: r[iA], text: r[iB] };
  }).filter(Boolean);
}

// ------------------------------------------------------------
// Supabase — fetch finished games for one league.
// ------------------------------------------------------------
async function fetchLeagueScores(league){
  const params = new URLSearchParams({
    select: "week,game_number,status,innings,home_team:teams!home_team_id(name),away_team:teams!away_team_id(name),lines:game_team_stats(is_home,runs)",
    season_id: `eq.${league.seasonId}`,
    status: "eq.final",
    order: "week.desc,game_number.desc",
    limit: String(GAMES_PER_LEAGUE),
  });
  const url = `${SUPABASE_URL}/rest/v1/games?${params.toString()}`;
  const res = await fetch(url, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    },
  });
  if(!res.ok) throw new Error(`Supabase request failed: ${res.status}`);
  const games = await res.json();

  return games.map(g => {
    const homeLine = g.lines.find(l => l.is_home);
    const awayLine = g.lines.find(l => !l.is_home);
    return {
      type: "score",
      league: league.label,
      week: g.week,
      gameNumber: g.game_number,
      away: g.away_team ? g.away_team.name : "Away",
      awayScore: awayLine ? awayLine.runs : null,
      home: g.home_team ? g.home_team.name : "Home",
      homeScore: homeLine ? homeLine.runs : null,
      innings: g.innings,
    };
  }).filter(it => it.awayScore !== null && it.homeScore !== null);
}

async function fetchAllScores(){
  const results = await Promise.allSettled(LEAGUES.map(fetchLeagueScores));
  const scores = [];
  results.forEach(r => {
    if(r.status === "fulfilled") scores.push(...r.value);
    else console.error("Failed to load scores for a league:", r.reason);
  });
  // Roughly chronological across leagues since all run the same weeks.
  scores.sort((a, b) => (b.week - a.week) || (b.gameNumber - a.gameNumber));
  return scores;
}

// ------------------------------------------------------------
// Rendering
// ------------------------------------------------------------
function renderScoreInner(it){
  const a = it.awayScore;
  const h = it.homeScore;
  const awayWin = a > h;
  const homeWin = h > a;
  const showFinalTag = it.innings && it.innings !== 9;
  const finalTag = showFinalTag ? `<span class="final-tag">F/${it.innings}</span>` : "";
  return `
    <div class="item">
      <span class="team ${awayWin ? "win" : ""}">${it.away}</span>
      <span class="score">${it.awayScore}</span>
      <span class="at">@</span>
      <span class="score">${it.homeScore}</span>
      <span class="team ${homeWin ? "win" : ""}">${it.home}</span>
      ${finalTag}
    </div>`;
}

function renderHeadlineInner(it){
  return `
    <div class="item">
      <span class="headline">
        ${it.flag ? `<span class="flag">${it.flag}</span>` : ""}${it.text}
      </span>
    </div>`;
}

const scoreBox = document.getElementById("scoreBox");
const scoreSlide = document.getElementById("scoreSlide");
const leagueName = document.getElementById("leagueName");
const track = document.getElementById("track");
document.documentElement.style.setProperty("--duration", SCROLL_SECONDS + "s");

let scoreItems = [];
let scoreIndex = 0;
let scoreTimer = null;

function fitScoreContent(){
  const fit = scoreSlide.querySelector(".score-fit");
  if(!fit) return;
  fit.style.transform = "scale(1)";
  const availableW = scoreSlide.clientWidth - 44;  // minus left/right padding
  const availableH = scoreSlide.clientHeight;
  const neededW = fit.scrollWidth;
  const neededH = fit.scrollHeight;
  if(neededW === 0 || neededH === 0) return;
  let scale = Math.min(availableW / neededW, availableH / neededH);
  scale = Math.max(0.4, Math.min(scale, 1.3)); // keep it within a sane range
  fit.style.transform = `scale(${scale})`;
}

function showScore(index){
  if(!scoreItems.length){
    scoreBox.style.display = "none";
    return;
  }
  scoreBox.style.display = "block";
  const it = scoreItems[index];
  leagueName.textContent = it.league ? `${it.league} LEAGUE` : "SMNL";
  scoreSlide.classList.remove("enter");
  scoreSlide.innerHTML = `<div class="score-fit">${renderScoreInner(it)}</div>`;
  void scoreSlide.offsetWidth; // force reflow so the animation replays
  scoreSlide.classList.add("enter");
  requestAnimationFrame(fitScoreContent);
}

function startScoreCycle(items){
  scoreItems = items;
  scoreIndex = 0;
  if(scoreTimer) clearInterval(scoreTimer);
  showScore(scoreIndex);
  if(scoreItems.length > 1){
    scoreTimer = setInterval(() => {
      scoreIndex = (scoreIndex + 1) % scoreItems.length;
      showScore(scoreIndex);
    }, SCORE_INTERVAL_SECONDS * 1000);
  }
}

function renderHeadlines(items){
  if(!items.length) items = FALLBACK_HEADLINES;
  let html = "";
  items.forEach(it => { html += renderHeadlineInner(it) + `<div class="divider"></div>`; });
  track.innerHTML = html + html; // duplicate for seamless infinite scroll
}

async function loadHeadlines(){
  if(!SHEET_CSV_URL || SHEET_CSV_URL.indexOf("PASTE_YOUR") !== -1){
    return FALLBACK_HEADLINES;
  }
  try{
    const res = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes("?") ? "&" : "?") + "_ts=" + Date.now());
    const text = await res.text();
    const rows = parseCSV(text);
    return rowsToHeadlines(rows);
  } catch(err){
    console.error("Failed to load headline sheet:", err);
    return FALLBACK_HEADLINES;
  }
}

async function loadAll(){
  const [headlines, scores] = await Promise.all([
    loadHeadlines(),
    fetchAllScores().catch(err => { console.error("Failed to load scores:", err); return []; }),
  ]);
  renderHeadlines(headlines);
  startScoreCycle(scores);
}

loadAll();
setInterval(loadAll, REFRESH_SECONDS * 1000);
window.addEventListener("resize", fitScoreContent);

</script>
</body>
</html>
